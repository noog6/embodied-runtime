name = "Reflective Continuity Experiment"
description = """Sources: {sources}. Read own reflection.json (offset 0); only artifact_not_found means first use. If state is unreadable, invalid or truncated, fail without overwriting. Then read ONE source at saved next index (initial 0): latest via shared_inspect_job_run(latest_completed, JOBn), RUNn via exact_run (verify Job), path via shared_workspace_read(offset 0). No extra reads or continuation. \

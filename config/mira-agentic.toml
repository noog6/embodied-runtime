[runtime]
profile = "mira"
hardware = "virtual"
camera = "picamera2"
cognition = "openai-responses"
vision = "openai-responses"
mode = "console"

[initiative]
enabled = true
platform_attention = true
actions = true
messages = true
continuation = true
goal_closure = true

[voice]
enabled = true
wake_word_enabled = true
wake_words = ["mira", "mirror"]
initial_timeout_seconds = 18
followup_timeout_seconds = 10

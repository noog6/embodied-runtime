[project]
name = "embodied-runtime"
version = "0.1.0"
description = "Reusable software runtime for embodied agents"
requires-python = ">=3.13"
dependencies = ["Pillow>=11.3,<13", "prompt-toolkit>=3.0.52,<4"]

[project.optional-dependencies]
test = ["pyte>=0.8.2,<0.9"]
openai = [
    "openai>=3.6,<4",
]
piper = [
    "piper-tts>=1.8,<2",
]
elevenlabs = [
    "elevenlabs>=2.66,<3",
]
twilio = [
    "twilio>=9.11,<10",
    "aiohttp>=3.14,<4",
]

[tool.setuptools.packages.find]
include = ["embodied_runtime*"]
namespaces = false
